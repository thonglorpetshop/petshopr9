<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b5394">
<title>ระบบรายงาน Pet Shop R9</title>
<!-- index v4 (สแกนต่อเนื่อง) -->
<style>
  html,body{margin:0;height:100%;background:#0b5394;font-family:'Sarabun',system-ui,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eef1f5}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;gap:10px;z-index:2;transition:opacity .3s}
  #load .p{font-size:46px}
  #load a{color:#ffd54f;font-size:13px;margin-top:18px}
  /* กล้องสแกน (เปิดจากหน้านอกสุด เพราะหน้าระบบที่ซ้อนอยู่ข้างในเปิดกล้องเองไม่ได้) */
  #cam{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:5;padding:14px}
  #cam.on{display:flex}
  #cam .bx{background:#fff;border-radius:16px;width:100%;max-width:460px;padding:16px;text-align:center}
  #cam h3{margin:0 0 10px;color:#0b5394}
  #reader{width:100%;min-height:240px;background:#000;border-radius:10px;overflow:hidden}
  #camMsg{color:#c00;font-size:14px;min-height:20px;margin:8px 0}
  #camInfo{font-size:16px;font-weight:700;min-height:22px;margin-top:8px;color:#556}
  #cam button,#cam label{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:12px;border-radius:10px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  #cam .alt{background:#fff;color:#0b5394;border:1.5px solid #0b5394}
</style>
</head>
<body>
<div id="load"><div class="p">🐾</div><div style="font-size:18px;font-weight:700">ระบบรายงาน Pet Shop</div><div style="opacity:.8">กำลังโหลด...</div>
  <a id="direct" href="#" target="_top">ถ้าโหลดนานหรือหน้าไม่ขึ้น กดที่นี่</a></div>
<iframe id="app" title="ระบบรายงาน Pet Shop"
  allow="camera; clipboard-read; clipboard-write; fullscreen"
  allowfullscreen></iframe>

<div id="cam">
  <div class="bx">
    <h3 id="camTi">📷 สแกน Barcode</h3>
    <div id="reader"></div>
    <div id="camInfo"></div>
    <div id="camMsg"></div>
    <label class="alt">📸 ถ่ายรูป Barcode แทน<input type="file" accept="image/*" capture="environment" hidden id="camFile"></label>
    <button class="alt" id="camClose">เสร็จ / ปิดกล้อง</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
  // ลิงก์เว็บแอป Apps Script (ลงท้าย /exec)
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxxMZM-qrj3RigIB2vmIZ08eaApZb3AsUn4i4YcnKmSiGAtfNtUuCS8XIOLNyd09trQ/exec';

  var target = WEBAPP_URL + location.search;   // ส่งต่อ ?page=cab&cab=C01 (QR ตู้)
  document.getElementById('direct').href = target;
  var f = document.getElementById('app');
  f.onload = function(){ var l = document.getElementById('load'); l.style.opacity = 0; setTimeout(function(){ l.style.display = 'none'; }, 300); };
  f.src = target;

  /* ---------- ตัวสแกนสำหรับหน้าระบบ ---------- */
  var cam = document.getElementById('cam'), msg = document.getElementById('camMsg'), info = document.getElementById('camInfo'), reader = null, replyTo = null, replyOrigin = '*';
  var multi = false, last = { t: '', at: 0 };
  function cfg(){
    var F = window.Html5QrcodeSupportedFormats || (window.__Html5QrcodeLibrary__ || {}).Html5QrcodeSupportedFormats, c = { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } };
    if (F) c.formatsToSupport = [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE].filter(function(x){ return x != null; });
    return c;
  }
  function hit(t){
    t = String(t || '').trim(); if (!t) return;
    if (!multi) { done(t); return; }
    var now = Date.now(); if (last.t === t && now - last.at < 2000) return;   // บาร์โค้ดเดิมค้างในกล้อง ไม่นับซ้ำ
    last = { t: t, at: now };
    info.style.color = '#556'; info.textContent = '… ' + t;
    send({ type: 'petshop-scan-result', text: t });
  }
  function okOrigin(o){ return /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(o); }
  function send(data){ if(replyTo){ try{ replyTo.postMessage(data, replyOrigin); }catch(e){} } }
  function stopCam(){ cam.classList.remove('on'); if(reader){ try{ reader.stop().catch(function(){}); }catch(e){} reader = null; } }
  function done(text){ stopCam(); send({ type:'petshop-scan-result', text:String(text||'').trim() }); }
  function openCam(){
    msg.textContent = ''; info.textContent = multi ? 'สแกนได้เรื่อย ๆ — เสร็จแล้วกดปิด' : ''; info.style.color = '#556';
    document.getElementById('camTi').textContent = multi ? '📷 สแกนต่อเนื่อง' : '📷 สแกน Barcode';
    last = { t: '', at: 0 }; cam.classList.add('on');
    if(typeof Html5Qrcode === 'undefined'){ msg.textContent = 'โหลดตัวสแกนไม่สำเร็จ — ใช้ "ถ่ายรูป Barcode แทน"'; return; }
    document.getElementById('reader').innerHTML = '';
    reader = new Html5Qrcode('reader', cfg());
    reader.start({ facingMode:'environment' }, { fps:15, qrbox:function(w,h){ return { width:Math.floor(Math.min(w*0.9,380)), height:Math.floor(Math.min(h*0.5,180)) }; } }, hit, function(){})
      .catch(function(){ msg.textContent = 'เปิดกล้องไม่ได้ — อนุญาตการใช้กล้องในเบราว์เซอร์ หรือกด "ถ่ายรูป Barcode แทน"'; });
  }
  document.getElementById('camClose').onclick = function(){ stopCam(); send({ type:'petshop-scan-cancel' }); };
  document.getElementById('camFile').onchange = function(){
    var file = this.files[0]; this.value = ''; if(!file) return;
    if(typeof Html5Qrcode === 'undefined'){ msg.textContent = 'โหลดตัวสแกนไม่สำเร็จ'; return; }
    if(reader){ try{ reader.stop().catch(function(){}); }catch(e){} }
    var h = new Html5Qrcode('reader', cfg());
    h.scanFile(file, false).then(function(t){ if (multi) { hit(t); if (reader) { try{ reader.stop().catch(function(){}); }catch(e){} reader = null; } openCam(); } else done(t); }).catch(function(){ msg.textContent = 'อ่าน Barcode จากรูปไม่ได้ ลองถ่ายให้ใกล้และชัดขึ้น'; });
  };
  window.addEventListener('message', function(e){
    var d = e.data || {};
    if(typeof d !== 'object') return;
    if(d.type === 'petshop-scan-info'){ info.textContent = String(d.msg || ''); info.style.color = d.ok ? '#1e8e3e' : '#c00'; return; }
    if(d.type !== 'petshop-scan-req') return;   // รับเฉพาะคำขอเปิดกล้อง
    replyTo = e.source; replyOrigin = (e.origin && e.origin !== 'null') ? e.origin : '*';
    multi = !!d.multi;
    send({ type:'petshop-scan-ack' });
    openCam();
  });
</script>
</body>
</html>
